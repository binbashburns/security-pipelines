name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Stage 1: secrets gate.
  secrets:
    uses: binbashburns/security-pipelines/.github/workflows/secrets.yml@main
    permissions:
      contents: read

  # Stage 2: static analysis + link audit, parallel after secrets passes.
  sast:
    needs: secrets
    if: github.event_name == 'pull_request'
    uses: binbashburns/security-pipelines/.github/workflows/sast.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      language: javascript

  link-check:
    needs: secrets
    uses: binbashburns/security-pipelines/.github/workflows/link-check.yml@main
    permissions:
      contents: read
      issues: write
    with:
      paths: "**/*.html **/*.md"
      create-issue: true
      root-dir: "."

  # Stage 3: dynamic scan. Not gated on sast (PR-only).
  dast:
    needs: secrets
    uses: binbashburns/security-pipelines/.github/workflows/dast.yml@main
    permissions:
      contents: read
      pull-requests: write
