name: SBOM + vuln (Syft + Grype)

on:
  workflow_call:
    inputs:
      path:
        description: "Directory to scan"
        required: false
        default: "."
        type: string
      severity-cutoff:
        description: "Grype severity cutoff (critical | high | medium | low | negligible)"
        required: false
        default: "medium"
        type: string
      fail-build:
        description: "Fail on findings at or above the cutoff"
        required: false
        default: false
        type: boolean
      only-fixed:
        description: "Only report vulnerabilities that have a fix available"
        required: false
        default: false
        type: boolean
      upload-sarif:
        description: "Upload the Grype SARIF to code scanning. The calling job must grant security-events: write."
        required: false
        default: false
        type: boolean
      comment-on-pr:
        description: "Post or update a PR comment when the token permits it"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      path:
        description: "Directory to scan"
        required: false
        default: "."
        type: string
      severity-cutoff:
        description: "Grype severity cutoff (critical | high | medium | low | negligible)"
        required: false
        default: "medium"
        type: string
      fail-build:
        description: "Fail on findings at or above the cutoff"
        required: false
        default: false
        type: boolean
      only-fixed:
        description: "Only report vulnerabilities that have a fix available"
        required: false
        default: false
        type: boolean
      upload-sarif:
        description: "Upload the Grype SARIF to code scanning. The calling job must grant security-events: write."
        required: false
        default: false
        type: boolean
      comment-on-pr:
        description: "Post or update a PR comment when the token permits it"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  syft-grype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate severity cutoff
        env:
          SEVERITY_CUTOFF: ${{ inputs.severity-cutoff }}
        run: |
          case "$SEVERITY_CUTOFF" in
            critical|high|medium|low|negligible) ;;
            *) echo "::error::Invalid severity-cutoff"; exit 1 ;;
          esac

      - name: Generate SBOM (CycloneDX JSON)
        id: sbom
        timeout-minutes: 15
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: ${{ inputs.path }}
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom.cdx.json
          artifact-name: sbom.cdx.json

      - name: Count scannable components
        id: deps
        shell: bash
        run: |
          jq -e '.bomFormat == "CycloneDX" and ((.components // []) | type == "array")' "$RUNNER_TEMP/sbom.cdx.json" >/dev/null
          # GitHub Action PURLs have no matching Grype vulnerability data.
          non_action=$(jq '[.components // [] | .[] | select((.purl // "") | startswith("pkg:github/") | not)] | length' "$RUNNER_TEMP/sbom.cdx.json")
          echo "non_action_count=$non_action" >> "$GITHUB_OUTPUT"
          echo "Scannable (non-Action) components: $non_action"

      - name: Vulnerability scan (Grype)
        id: grype
        if: steps.deps.outputs.non_action_count != '0'
        timeout-minutes: 15
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/sbom.cdx.json
          fail-build: ${{ inputs.fail-build }}
          severity-cutoff: ${{ inputs.severity-cutoff }}
          only-fixed: ${{ inputs.only-fixed }}
          cache-db: true
          output-format: sarif
          output-file: ${{ runner.temp }}/grype.sarif

      - name: Upload SARIF
        if: ${{ !cancelled() && steps.grype.outputs.sarif != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-sarif
          path: ${{ steps.grype.outputs.sarif }}

      - name: Summarize scan
        id: report
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          COUNT_OUTCOME: ${{ steps.deps.outcome }}
          COMPONENT_COUNT: ${{ steps.deps.outputs.non_action_count }}
          SCAN_OUTCOME: ${{ steps.grype.outcome }}
          SARIF_PATH: ${{ steps.grype.outputs.sarif }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryFile = 'grype-summary.md';
            let body = '## SBOM + Grype\n\n';
            let failure;
            try {
              const count = process.env.COMPONENT_COUNT;
              if (process.env.SBOM_OUTCOME !== 'success' || process.env.COUNT_OUTCOME !== 'success' || !/^\d+$/.test(count)) {
                throw new Error('SBOM generation or component counting failed; see workflow logs.');
              }
              const nonAction = Number(count);
              if (nonAction === 0) {
                body += 'No scannable application dependencies found. Grype scan skipped.';
              } else {
                if (!['success', 'failure'].includes(process.env.SCAN_OUTCOME)) throw new Error('Grype did not run.');
                const report = JSON.parse(fs.readFileSync(process.env.SARIF_PATH, 'utf8'));
                if (!Array.isArray(report.runs) || !report.runs.length) throw new Error('Grype SARIF report contains no runs.');
                const counts = { error: 0, warning: 0, note: 0, none: 0 };
                for (const run of report.runs) {
                  const results = run.results ?? [];
                  if (!Array.isArray(results)) throw new Error('Grype SARIF results are invalid.');
                  for (const result of results) {
                    const level = result.level ?? 'warning';
                    if (!Object.hasOwn(counts, level)) throw new Error('Grype SARIF result has an invalid level.');
                    counts[level]++;
                  }
                }
                body += `Scanned **${nonAction}** components from the generated SBOM.\n\n`;
                body += `SARIF levels: **${counts.error}** error · **${counts.warning}** warning · **${counts.note}** note · **${counts.none}** none.\n\nSee the SARIF artifact for vulnerability severities.`;
                if (process.env.SCAN_OUTCOME !== 'success') {
                  failure = 'Grype failed or its severity gate was reached; see workflow logs.';
                  body += `\n\n**Failed:** ${failure}`;
                }
              }
            } catch (error) {
              failure = `Scan failed: ${error.message}`;
              body += failure;
            }
            body += `\n\n[Artifacts](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts)`;

            await core.summary.addRaw(body).write();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, summaryFile), body);
            core.setOutput('ready', 'true');
            if (failure) core.setFailed(failure);

      - name: Comment summary on PR
        if: >-
          ${{ !cancelled() && steps.report.outputs.ready == 'true' && inputs.comment-on-pr &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_FILE: grype-summary.md
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.RUNNER_TEMP, process.env.SUMMARY_FILE), 'utf8');
            const marker = body.split('\n', 1)[0];
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const prior = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  upload-sarif:
    needs: syft-grype
    if: >-
      ${{ !cancelled() && inputs.upload-sarif &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download Grype SARIF
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grype-sarif
          path: ${{ runner.temp }}/sarif

      - name: Upload to code scanning
        if: steps.fetch.outcome == 'success'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: grype
