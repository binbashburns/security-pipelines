name: Secrets scan (TruffleHog)

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Extra trufflehog args. The action already adds --fail."
        required: false
        default: "--only-verified"
        type: string
  workflow_dispatch:
    inputs:
      extra-args:
        description: "Extra trufflehog args. The action already adds --fail."
        required: false
        default: "--only-verified"
        type: string

permissions: {}

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve scan range
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          head="${PR_HEAD:-$PUSH_SHA}"
          # Treat zero-SHA (new branch / initial push) as no base so the full history is scanned.
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=""
          fi
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::warning::base commit $base is unreachable (likely force-pushed); scanning full history"
            base=""
          fi
          # If base and head match (e.g. workflow_dispatch, single-commit push), drop base so the action falls back to a full scan.
          if [ -n "$base" ] && [ "$base" = "$head" ]; then
            base=""
          fi
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "head=$head" >>"$GITHUB_OUTPUT"

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@e76dff8a7e57d6df0c60ad8cbf5d5cba505a8fc9 # v3.99.2
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: ${{ inputs.extra-args }}
          version: 3.97.4
