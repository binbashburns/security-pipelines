name: SAST (Semgrep)

on:
  workflow_call:
    inputs:
      language:
        description: "auto, or comma-separated packs (javascript, typescript, csharp, ruby, python, go, java, php). A pack list also runs p/ci."
        required: false
        default: "auto"
        type: string
      severity-fail:
        description: "Fail on findings at this severity or above (ERROR | WARNING | INFO | none)"
        required: false
        default: "none"
        type: string
      comment-on-pr:
        description: "Post or update a PR comment when the token permits it"
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      language:
        description: "auto, or comma-separated packs (javascript, typescript, csharp, ruby, python, go, java, php). A pack list also runs p/ci."
        required: false
        default: "auto"
        type: string
      severity-fail:
        description: "Fail on findings at this severity or above (ERROR | WARNING | INFO | none)"
        required: false
        default: "none"
        type: string
      comment-on-pr:
        description: "Post or update a PR comment when the token permits it"
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Semgrep
        id: scan
        timeout-minutes: 25
        shell: bash
        env:
          LANGUAGE_PACKS: ${{ inputs.language }}
          SEVERITY_FAIL: ${{ inputs.severity-fail }}
        run: |
          gate=$(printf '%s' "$SEVERITY_FAIL" | tr '[:lower:]' '[:upper:]')
          case "$gate" in
            NONE|ERROR|WARNING|INFO) ;;
            *) echo "::error::Invalid severity-fail; use ERROR, WARNING, INFO, or none"; exit 1 ;;
          esac
          if [[ "$LANGUAGE_PACKS" == "auto" ]]; then
            flags=(--config=auto)
          else
            flags=(--config=p/ci)
            [[ -n "$LANGUAGE_PACKS" && "$LANGUAGE_PACKS" != *, ]] || { echo "::error::Invalid language list"; exit 1; }
            IFS=',' read -ra packs <<< "$LANGUAGE_PACKS"
            for p in "${packs[@]}"; do
              p="${p#"${p%%[![:space:]]*}"}"
              p="${p%"${p##*[![:space:]]}"}"
              case "$p" in
                javascript|csharp|ruby|python|go|java|php|typescript) ;;
                *) echo "::error::Unsupported language pack"; exit 1 ;;
              esac
              flags+=("--config=p/$p")
            done
          fi
          mkdir -p "$RUNNER_TEMP/semgrep"
          # Only the scanner runs in its image; JavaScript actions run on Ubuntu.
          # No --error: findings are evaluated separately from tool failures.
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$PWD:/src:ro" -w /src \
            -v "$RUNNER_TEMP/semgrep:/reports:rw" \
            semgrep/semgrep:1.176.1@sha256:34ab619bf1391a24bfda3f05debd0d8a6ce3093c2d5f9d39cfc00f83c1397823 \
            semgrep scan "${flags[@]}" \
              --json --output=/reports/semgrep.json \
              --metrics=off --disable-version-check

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep/semgrep.json

      - name: Summarize scan
        id: report
        if: ${{ !cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SEVERITY_FAIL: ${{ inputs.severity-fail }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryFile = 'semgrep-summary.md';
            const gate = process.env.SEVERITY_FAIL.toUpperCase();
            const order = { ERROR: 0, WARNING: 1, INFO: 2, NONE: 3 };
            let body = '## Semgrep SAST\n\n';
            let failure;
            try {
              if (process.env.SCAN_OUTCOME !== 'success') throw new Error('Semgrep did not complete successfully; see workflow logs.');
              if (!Object.hasOwn(order, gate)) throw new Error('Invalid severity-fail input.');
              const report = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'semgrep/semgrep.json'), 'utf8'));
              if (!Array.isArray(report.results) || !Array.isArray(report.errors) || !Array.isArray(report.paths?.scanned)) {
                throw new Error('Semgrep report is missing required results, errors, or scanned paths.');
              }
              const counts = { ERROR: 0, WARNING: 0, INFO: 0 };
              for (const result of report.results) {
                const severity = result.extra?.severity?.toUpperCase();
                if (!Object.hasOwn(counts, severity)) throw new Error('Semgrep report contains an invalid finding severity.');
                counts[severity]++;
              }
              const scanned = report.paths.scanned.length;
              body += scanned ? `Scanned **${scanned}** files.\n\n` : 'No files scanned; check language selection and ignore rules.\n\n';
              body += `**${counts.ERROR}** error · **${counts.WARNING}** warning · **${counts.INFO}** info`;
              if (report.errors.length) {
                body += `\n\nScanner reported **${report.errors.length}** errors; review the report for incomplete coverage.`;
                if (report.errors.some(error => String(error.level).toLowerCase() === 'error')) {
                  failure = 'Semgrep reported scan errors; coverage may be incomplete.';
                }
              }
              if (gate !== 'NONE') {
                const gated = Object.entries(counts).reduce((sum, [severity, count]) => sum + (order[severity] <= order[gate] ? count : 0), 0);
                if (gated) failure = `${gated} findings at ${gate} or above.`;
              }
            } catch (error) {
              failure = `Scan failed: ${error.message}`;
              body += failure;
            }
            if (failure) body += `\n\n**Failed:** ${failure}`;
            body += `\n\n[Report artifact](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts)`;

            await core.summary.addRaw(body).write();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, summaryFile), body);
            core.setOutput('ready', 'true');
            if (failure) core.setFailed(failure);

      - name: Comment summary on PR
        if: >-
          ${{ !cancelled() && steps.report.outputs.ready == 'true' && inputs.comment-on-pr &&
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.actor != 'dependabot[bot]' }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUMMARY_FILE: semgrep-summary.md
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const body = fs.readFileSync(path.join(process.env.RUNNER_TEMP, process.env.SUMMARY_FILE), 'utf8');
            const marker = body.split('\n', 1)[0];
            const params = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
            const prior = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({ owner: params.owner, repo: params.repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }
